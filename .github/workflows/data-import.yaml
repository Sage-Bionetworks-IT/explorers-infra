# Manually import the data release in an environment's data image, without deploying the app.
name: data-import

on:
  workflow_dispatch:
    inputs:
      target:
        description: Explorer environment to import into
        type: choice
        options: ['qtl/dev']

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.7"
          checksum: "6681d691eb7f9c00ac6a3af54252f7ab29ae72f0c8f95bdc7f9d1401c23ea868"
      - name: Install python dependencies
        run: uv sync --frozen --no-group dev
      - name: Plan the import
        id: plan
        run: uv run python -m tools.deploy_plan --head "$HEAD_SHA" --data-import "$TARGET"
        env:
          HEAD_SHA: ${{ github.sha }}
          TARGET: ${{ inputs.target }}
  data-import:
    name: ${{ fromJSON(needs.plan.outputs.matrix)[0].target }}
    needs: plan
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aws-data-import.yaml
    with:
      explorer: ${{ fromJSON(needs.plan.outputs.matrix)[0].explorer }}
      environment: ${{ fromJSON(needs.plan.outputs.matrix)[0].environment }}
      role-to-assume: ${{ fromJSON(needs.plan.outputs.matrix)[0].aws_role_arn }}
      role-session-name: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_id }}
