# Deploy one explorer environment: run the repo's checks (audit, unit tests, synth), then deploy the app.
name: deploy-target

on:
  workflow_call:
    inputs:
      explorer:
        required: true
        type: string
      environment:
        required: true
        type: string
      aws-role-arn:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    with:
      explorer: ${{ inputs.explorer }}
      environment: ${{ inputs.environment }}
  aws-deploy:
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aws-deploy.yaml
    with:
      explorer: ${{ inputs.explorer }}
      environment: ${{ inputs.environment }}
      role-to-assume: ${{ inputs.aws-role-arn }}
      role-session-name: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_id }}
  # TODO(EX-208): add the data import job here, after `aws-deploy`
