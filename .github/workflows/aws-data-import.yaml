# Reusable: run one data import task for an explorer environment and follow it to the end.
name: aws-data-import

# Shares the deploy's group, so an import never runs while a deploy changes its task.
concurrency:
  group: ${{ inputs.explorer }}-${{ inputs.environment }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      aws-region:
        type: string
        default: us-east-1
      role-to-assume:
        required: true
        type: string
      role-session-name:
        required: true
        type: string
      explorer:
        required: true
        type: string
      environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  data-import:
    environment: ${{ inputs.explorer }}-${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.7"
          checksum: "6681d691eb7f9c00ac6a3af54252f7ab29ae72f0c8f95bdc7f9d1401c23ea868"
      - name: Install python dependencies
        run: uv sync --frozen --no-group dev
      - name: Assume AWS Role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.role-to-assume }}
          role-session-name: ${{ inputs.role-session-name }}
      - name: Run data import
        id: import
        run: uv run python -m tools.data_import --explorer "$EXPLORER" --environment "$ENVIRONMENT"
        env:
          EXPLORER: ${{ inputs.explorer }}
          ENVIRONMENT: ${{ inputs.environment }}
      # A cancelled step gets only seconds to clean up, so stop the task here too.
      - name: Stop the import task
        if: cancelled() && steps.import.outputs.task_arn != ''
        run: |
          cluster="${TASK_ARN#*:task/}"
          aws ecs stop-task --cluster "${cluster%/*}" --task "$TASK_ARN" \
            --reason "The GitHub Actions run that started this import was cancelled"
        env:
          TASK_ARN: ${{ steps.import.outputs.task_arn }}
