name: deploy

on:
  push:
    branches: ['main']
  # Manual runs deploy every deployable target, e.g. to pick up new `edge` images.
  workflow_dispatch:
    inputs:
      import-data:
        description: Also import the data release after the app deploys
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_targets: ${{ steps.plan.outputs.has_targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.7"
          checksum: "6681d691eb7f9c00ac6a3af54252f7ab29ae72f0c8f95bdc7f9d1401c23ea868"
      - name: Install python dependencies
        run: uv sync --frozen --no-group dev
      - name: Plan deploys
        id: plan
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            uv run python -m tools.deploy_plan --head "$HEAD_SHA" --all
          else
            uv run python -m tools.deploy_plan --base "$BASE_SHA" --head "$HEAD_SHA"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
  deploy:
    name: ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-target.yaml
    with:
      explorer: ${{ matrix.explorer }}
      environment: ${{ matrix.environment }}
      aws-role-arn: ${{ matrix.aws_role_arn }}
      import-data: ${{ inputs.import-data == true }}
