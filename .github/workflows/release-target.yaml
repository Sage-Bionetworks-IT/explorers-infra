# Release one explorer environment: test, then deploy the app.
name: release-target

on:
  workflow_call:
    inputs:
      explorer:
        required: true
        type: string
      environment:
        required: true
        type: string
      aws-account-id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    with:
      explorer: ${{ inputs.explorer }}
      environment: ${{ inputs.environment }}
  app:
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aws-deploy.yaml
    with:
      explorer: ${{ inputs.explorer }}
      environment: ${{ inputs.environment }}
      role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/sagebase-github-oidc-explorers-infra
      role-session-name: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_id }}
  # TODO(EX-148): add the data release job here, after `app`, for targets whose data changed
